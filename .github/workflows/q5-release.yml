# Q5 浏览器门（#93 裁决）：**不进 per-PR CI**——它的已知抖动是 Docker/端口类
# 基建问题，挂每次 PR 会用假红磨掉对门的信任；口径是「发布级证据」。
# 触发：①push tag v*（发布 ⟹ 20 连，04 矩阵「连续 20 次无偶发」）；
#       ②workflow_dispatch（分支预验/临时复跑 ⟹ 自选轮数）。
name: q5-release

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 连续冷启轮数（发布口径 20；工作流自验 1）
        default: '1'
        type: string
  push:
    tags:
      - 'v*'

jobs:
  q5:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 check.yml 同规：workspace 包走 dist/（#35），先 build 再跑。
      - name: Build workspace packages
        run: pnpm -r --if-present build

      # E2E 用系统 Chrome（playwright.config channel:'chrome'，P1-19 的刻意选择：
      # 免浏览器下载）；ubuntu-latest runner 预装 google-chrome，无需 install。
      - name: Run Q5 loop (fresh env each round)
        env:
          ROUNDS: ${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '20' }}
        run: bash scripts/q5-loop.sh "$ROUNDS"

      # 取证（六原语 5）：每轮日志 + 失败 attempt 的 evidence 包。
      - name: Upload Q5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q5-evidence
          path: artifacts/q5/
          if-no-files-found: warn
          retention-days: 30

  # Q8 短档（#109 修订后两级判定）：runner 实测 2vCPU/7.8GiB **不达** 04 §8
  # （4CPU/8GiB）——本 job 的绿只能是 PASS-CONSERVATIVE（保守口径，标签在日志里，
  # 归档表必须引用标签字样）；权威判在合格环境执行（欠账见 load-performance-
  # acceptance.md）。exit 3 INCONCLUSIVE 会红本 job：去合格环境复判，不许放行。
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      # #116：报告必须落 artifact（判定在日志里，数字在 JSON 里）——runner 实测
      # ingest 144.5ms 贫血 vs 判据环境 15.4ms 这类趋势对比靠的就是归档的 JSON。
      # `set -o pipefail`：管道给 tee 不给退出码兜底，缺它会让失败被 tee 吞成绿。
      - name: Run Q8 load profile (short)
        run: |
          mkdir -p artifacts/q8
          set -o pipefail
          pnpm test:load | tee artifacts/q8/load-report.txt

      - name: Upload Q8 report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q8-load-report
          path: artifacts/q8/
          if-no-files-found: warn
          retention-days: 90

  # Q9 安装门（#116 延迟项收口）：空卷 + **生产同一份 compose.yml** 的全新安装冒烟。
  # 不挂 per-PR：镜像构建（冷缓存 3–6 分钟）与 runner 资源画像都和判据环境不同，
  # 它是发布/手动的证据级门——口径与判据清单见 docs/agent/compose-standard-loop-acceptance.md。
  # 挂法：push tag v*（与 Q5 同一次发布取证）+ workflow_dispatch 预验。
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 冒烟在**宿主**上跑真 node CLI（pair/workspace add/start）——那需要 dist，
      # 镜像内的构建不给宿主用（Q5 同规）。
      - run: pnpm -r --if-present build
      - name: Run Q9 compose smoke (fresh volumes)
        run: |
          mkdir -p artifacts/q9
          set -o pipefail
          pnpm test:compose-smoke | tee artifacts/q9/compose-smoke.log
      - name: Upload Q9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q9-compose-smoke
          path: artifacts/q9/
          if-no-files-found: warn
          retention-days: 90
