name: check

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连推只保留最新一轮（#200）：不取消的话每次推送都新起一轮——评审整改往往推 2–4 次，
# 于是"最新一次到底绿没绿"要靠人眼辨认，也白跑几轮。
#
# 为什么**不**顺手加 `paths-ignore` 跳过纯文档改动：① 仓库转为公开后 Actions 分钟数不计量，
# 省下的不是钱；② `pnpm check` 里含 `format:check`，而它恰恰覆盖 `docs/**` 与 `*.md`——
# 跳过等于让文档格式没人管；③ 只改文档的 PR 若因此永远等不到检查，"必检项"会变成卡住的假象。
# 文档格式由本地 `pnpm check` 与 CI 一起守，别为了省不存在的分钟数把它关掉。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from the packageManager field in package.json
      # (pinned to an exact version); action-setup installs exactly that.
      # Must run before setup-node so its `cache: pnpm` can find pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先 build 再查（#35 同一坑）：scripts/ 的 phase1 harness 经包名 import
      # workspace 包走 dist/（root typecheck 覆盖 scripts/**/*.ts），CI 全新
      # 检出没有 dist 会 TS2307；与下方 integration job 同规。
      - name: Build workspace packages
        run: pnpm -r --if-present build

      - name: Run static checks
        run: pnpm check

      # Q3 DSH 契约门（A0-6/#288）：此前它只是**文档上的** release/PR 必跑项——
      # .github 里没有任何接线，版本锁复算（dsh.lock ↔ catalog ↔ pnpm-lock）与契约探针
      # 只在本地跑。接进 check job（复用同一份 install+build）：63 用例约 3s（2026-10-16
      # 计数；A0-6 接线时为 39），无网络、无 PG、无 Docker——没有理由让它继续待在
      # 「人心里的门」里。
      - name: Run DSH contract probes (Q3)
        run: pnpm test:dsh-contract

  # Q2 数据门（#43）：真实 PostgreSQL 18 一次性容器，与本地同判据。
  # ubuntu-latest 自带 Docker，scripts/with-test-postgres.mts 自管容器生命周期。
  # 先 build 再测：integration 经包名 import 走 dist/，不 build 会测到陈旧构建（#35）。
  integration:
    runs-on: ubuntu-latest
    # Q2/Q7/Q6 + Router/c2/RD-05a 生产验收及负控同处 required integration。
    # 既有总耗时 17m22，25 分钟余量 7m38；RD-05a 新增后的总耗时待本轮实测，
    # 再按完整 job（含扫描/上传）调整，不能只用 driver 耗时或移出 required 门。
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --if-present build

      - name: Run integration tests (Q2, real PostgreSQL)
        run: pnpm test:integration

      # Q7 安全门（A0-6/#288）：与 Q3 同病——门禁分级文档把它记为 G0「release 必跑；
      # 动认证/授权/审批/投影的 PR 必跑」，CI 却只跑 Q0/Q2。放 integration job 是因为
      # 它要真 PG（security project 起自己的容器）；secret-scan 自检与实扫、许可 gate
      # 同一条命令内三半边的既有口径不变。本机实测全程 17.5s。
      - name: Run security gate (Q7)
        run: pnpm test:security

      # Q6 故障门（A0-6/#288）：同属「文档记为必跑、CI 无接线」。本机实测 32 用例 9.5s，
      # 与 Q2/Q7 同吃真 PG。故障注入类用例在 runner 上的抖动风险高于本机——若它开始
      # 偶发变红，正确的处理是修确定性（bounded poll，见 poll-until-acceptance），
      # 不是把它挪回「人心里的门」。
      - name: Run resilience gate (Q6)
        run: pnpm test:resilience

      # #519: Linux 真 Hub/Node/独立受限 Runtime；只回放模型 HTTP 出口。
      # 驱动自建临时 PG，独立判定要求九场景、零业务副作用、账本配对与输入清理。
      - name: Run Router production acceptance
        run: pnpm exec tsx scripts/run-router-evaluation.ts

      - name: Run Router guard mutations
        run: pnpm exec tsx scripts/mutate-router-evaluation.ts

      - name: Run private tool error production acceptance
        run: |
          pnpm exec tsx scripts/run-rd04c2-acceptance.ts --tool-error-followup
          pnpm exec tsx scripts/verify-rd04c2-acceptance.ts --tool-error-followup
          pnpm exec tsx scripts/check-rd04c2-evidence-negatives.ts --tool-error-followup

      - name: Scan private tool error evidence
        id: private_error_evidence_scan
        if: always()
        run: |
          if [ -d artifacts/evidence/rd04c2/tool-error-followup ]; then
            scripts/secret-scan.sh artifacts/evidence/rd04c2/tool-error-followup
          fi

      - name: Upload private tool error evidence
        if: always() && steps.private_error_evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: private-tool-error-evidence
          path: artifacts/evidence/rd04c2/tool-error-followup/
          if-no-files-found: warn
          retention-days: 30

      # #546：本次 checkout HEAD + 新 UUID 独占一个 attempt；三个 CLI 显式传同一路径，
      # 不搜索 latest/旧 PASS。失败也只扫描/上传本 attempt 的中性诊断包，不改写门禁结论。
      - name: Prepare RD-05a evidence path
        id: rd05a_attempt
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          attempt=$(node -e 'process.stdout.write(require("node:crypto").randomUUID())')
          evidence_dir="artifacts/evidence/rd05a/$head/$attempt"
          test ! -e "$evidence_dir"
          printf 'head=%s\nattempt=%s\ndir=%s\nresult=%s/result.json\n' \
            "$head" "$attempt" "$evidence_dir" "$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Run RD-05a combined production acceptance
        id: rd05a_driver
        env:
          RD05A_RESULT: ${{ steps.rd05a_attempt.outputs.result }}
        run: pnpm exec tsx scripts/run-rd05a-acceptance.ts "$RD05A_RESULT"

      - name: Bind this RD-05a result to this attempt
        id: rd05a_result
        env:
          RD05A_HEAD: ${{ steps.rd05a_attempt.outputs.head }}
          RD05A_ATTEMPT: ${{ steps.rd05a_attempt.outputs.attempt }}
          RD05A_RESULT: ${{ steps.rd05a_attempt.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RD05A_HEAD"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { lstat, readFile } from 'node:fs/promises'
          import { dirname, join } from 'node:path'
          const { RD05A_HEAD: head, RD05A_ATTEMPT: attempt, RD05A_RESULT: path } = process.env
          assert.equal(path, `artifacts/evidence/rd05a/${head}/${attempt}/result.json`)
          assert((await lstat(dirname(path))).isDirectory(), 'missing fresh attempt directory')
          for (const file of [path, join(dirname(path), 'attempt.json'), join(dirname(path), 'events.jsonl')]) {
            assert((await lstat(file)).isFile(), 'missing regular evidence file')
          }
          const result = JSON.parse(await readFile(path, 'utf8'))
          const marker = JSON.parse(await readFile(join(dirname(path), 'attempt.json'), 'utf8'))
          assert.equal(marker.campaignId, attempt)
          assert.equal(marker.commit, head)
          assert.equal(result.campaignId, attempt)
          for (const key of ['commit', 'harnessDigest', 'assemblyDigest']) {
            assert.equal(result.provenance[key], marker[key], `attempt binding changed: ${key}`)
          }
          NODE

      - name: Independently verify RD-05a evidence
        id: rd05a_checker
        env:
          RD05A_RESULT: ${{ steps.rd05a_attempt.outputs.result }}
        run: pnpm exec tsx scripts/verify-rd05a-acceptance.ts "$RD05A_RESULT"

      - name: Reject RD-05a evidence negatives
        id: rd05a_negatives
        env:
          RD05A_RESULT: ${{ steps.rd05a_attempt.outputs.result }}
        run: pnpm exec tsx scripts/check-rd05a-evidence-negatives.ts "$RD05A_RESULT"

      - name: Scan this RD-05a attempt evidence
        id: rd05a_evidence_scan
        if: always() && steps.rd05a_attempt.outcome == 'success'
        env:
          RD05A_DIR: ${{ steps.rd05a_attempt.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RD05A_DIR" ]; then
            scripts/secret-scan.sh "$RD05A_DIR"
            printf 'present=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RD-05a attempt evidence (not a verdict)
        if: always() && steps.rd05a_evidence_scan.outcome == 'success' && steps.rd05a_evidence_scan.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rd05a-evidence-${{ steps.rd05a_attempt.outputs.head }}-${{ steps.rd05a_attempt.outputs.attempt }}
          path: ${{ steps.rd05a_attempt.outputs.dir }}/
          if-no-files-found: error
          retention-days: 30

      - name: Scan Router acceptance evidence
        id: router_evidence_scan
        if: always()
        run: |
          if [ -d artifacts/evidence/router-evaluation ]; then
            scripts/secret-scan.sh artifacts/evidence/router-evaluation
          fi

      - name: Upload Router acceptance evidence
        if: always() && steps.router_evidence_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: router-evaluation-evidence
          path: artifacts/evidence/router-evaluation/
          if-no-files-found: warn
          retention-days: 30
