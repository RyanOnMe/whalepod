# 单源反代（P1-20）：浏览器只见这一个 origin。
# 与 E2E 装配里 vite server.proxy 的角色同形（03 §4 的 Origin 逐字节相等 +
# Cookie Secure 分支都按 publicOrigin 判，反代不得改写浏览器侧 origin）。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 产物上传体积：代码权威界 ARTIFACT_MAX_BYTES=50MiB（store.ts:18，02/04 同口径）。
  # nginx 必须**略大于**代码界——否则 16–50MiB 的合法上传吃 nginx 413 HTML 页
  # （应让 hub 的 413 JSON 应答界内超限，一审 B4）。multipart 帧开销留 2MiB。
  client_max_body_size 52m;

  # API：保持路径原样透传（hub 的路由以 /api/v1 为前缀）。
  location /api/v1/ {
    proxy_pass http://hub:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # #113：透传客户端真值——hub trustProxy（compose 置 WHALEPOD_TRUST_PROXY=true）
    # 按首跳 IP 给登录/邀请限流分桶，否则全队共享网关 IP 一个桶。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  # Browser realtime（/ws/v1/…）与 Node WS（/ws/v1/node）共用 upgrade 通路。
  location /ws/v1/ {
    proxy_pass http://hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # #113：WS 通路同注 XFF（与 /api/v1 同门；限流/审计取同一真值）。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 长连接不被空闲掐断（心跳周期 10s 级；4h 上限防泄漏）。
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }

  # 存活探针反代：web 容器的 healthcheck 打这里，一条路径同时验
  # 「nginx 活着 + 反代配置对 + hub 活着」——compose 编排的浏览器视角锚点。
  location = /healthz {
    proxy_pass http://hub:8080/healthz;
  }

  # SPA fallback：非 API 路径一律回 index.html（web 用 HistoryRouter 类前端路由）。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
