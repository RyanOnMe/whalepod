# 单源反代（P1-20）：浏览器只见这一个 origin。
# 与 E2E 装配里 vite server.proxy 的角色同形（03 §4 的 Origin 逐字节相等 +
# Cookie Secure 分支都按 publicOrigin 判，反代不得改写浏览器侧 origin）。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 产物上传体积（ArtifactStore 走 API）：默认 1m 会 413，显式抬到 16m。
  client_max_body_size 16m;

  # API：保持路径原样透传（hub 的路由以 /api/v1 为前缀）。
  location /api/v1/ {
    proxy_pass http://hub:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # Browser realtime（/ws/v1/…）与 Node WS（/ws/v1/node）共用 upgrade 通路。
  location /ws/v1/ {
    proxy_pass http://hub:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # 长连接不被空闲掐断（心跳周期 10s 级；4h 上限防泄漏）。
    proxy_read_timeout 14400s;
    proxy_send_timeout 14400s;
  }

  # 存活探针反代：web 容器的 healthcheck 打这里，一条路径同时验
  # 「nginx 活着 + 反代配置对 + hub 活着」——compose 编排的浏览器视角锚点。
  location = /healthz {
    proxy_pass http://hub:8080/healthz;
  }

  # SPA fallback：非 API 路径一律回 index.html（web 用 HistoryRouter 类前端路由）。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
