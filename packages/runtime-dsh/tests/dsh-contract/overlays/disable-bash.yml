# PC-00 (#463) probe overlay: remove the model-facing `bash` tool at boot.
#
# A boot-level `disabled` row is the authority boundary — the plugin never
# loads, so no schema is advertised and no call can resolve. This is
# deliberately NOT `ctx.tools.restrict()`: the vendor README calls restriction
# "live visibility composition, not an authority boundary".
- id: tool-bash
  disabled: true
